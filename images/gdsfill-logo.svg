<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatchMagenta" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#3d1030"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e0459b" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatchCyan" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#0c2f38"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#38c6d9" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatchAmber" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#3a2c08"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e8b53a" stroke-width="1.4"/>
    </pattern>
    <pattern id="hatchBlue" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#123b6b"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#4d9fff" stroke-width="1.6"/>
    </pattern>
    <linearGradient id="streakB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d9fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4d9fff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#0a0d12"/>

